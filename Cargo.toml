[package]
name = "ota-authority-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Canonical wire protocol and conformance model for Ota crossing authority"
license = "Apache-2.0"
repository = "https://github.com/ota-run/authority-protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.2.0"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
